softmax-cuda:
  official_baseline:
    implementation: 1
    description: existing optimized baseline
  official_cases:
    - slice_size: 128
    - slice_size: 256
    - slice_size: 784
    - slice_size: 1024
    - slice_size: 2048
  forbidden_comparison:
    - impl0_to_impl1_as_agent_speedup

topk-cuda:
  official_cases:
    hidden_size: [3072, 4096, 8192, 16384, 32768, 65536, 131072]
    topk: [1024, 2048]
  robust_baseline_required: true
  noisy_case_policy:
    cv_over_15_percent: exclude_from_speedup_claim_until_remeasured

shmembench-cuda:
  official_validated_comparison:
    variant: original
    block_size: 256
  diagnostic_sweep:
    - variant: original
      block_size: 128
    - variant: original
      block_size: 512
    - variant: original
      block_size: 1024
  optional_variants:
    - padded
    - vectorized
